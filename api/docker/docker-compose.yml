services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saleshub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: carlossouzadev/cashinbox-api:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3334:3334"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/saleshub?schema=public
      - PORT=3334
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
